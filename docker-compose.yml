# ============================================
# AuthKit Pro — Docker Compose
# ============================================
#
# Quick Start:
#   With MongoDB:    docker compose --profile mongodb up -d
#   With PostgreSQL: docker compose --profile postgres up -d
#
# Stop:
#   docker compose down
#
# View logs:
#   docker compose logs -f app
#
# ============================================

services:
  # -------- Application --------
  app:
    build: .
    container_name: authkit-pro
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_in_production}
      - APP_NAME=${APP_NAME:-AuthKit Pro}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5000}
      # Database (set DB_TYPE to "mongodb" or "postgres")
      - DB_TYPE=${DB_TYPE:-mongodb}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/authkit_pro}
      - POSTGRES_URI=${POSTGRES_URI:-postgresql://authkit:authkit@postgres:5432/authkit_pro}
      - POSTGRES_SSL=${POSTGRES_SSL:-false}
      # Email
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-mailtrap}
      - MAILTRAP_TOKEN=${MAILTRAP_TOKEN:-}
      - MAILTRAP_INBOX_ID=${MAILTRAP_INBOX_ID:-}
      - MAILTRAP_ENDPOINT=${MAILTRAP_ENDPOINT:-https://send.api.mailtrap.io/}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      # Google OAuth (optional)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:5000/api/auth/google/callback}
    depends_on:
      mongo:
        condition: service_started
        required: false
      postgres:
        condition: service_healthy
        required: false
    networks:
      - authkit-network

  # -------- MongoDB --------
  mongo:
    image: mongo:7
    container_name: authkit-mongo
    profiles:
      - mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - authkit-network

  # -------- PostgreSQL --------
  postgres:
    image: postgres:16-alpine
    container_name: authkit-postgres
    profiles:
      - postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=authkit
      - POSTGRES_PASSWORD=authkit
      - POSTGRES_DB=authkit_pro
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authkit -d authkit_pro"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - authkit-network

volumes:
  mongo-data:
  postgres-data:

networks:
  authkit-network:
    driver: bridge
